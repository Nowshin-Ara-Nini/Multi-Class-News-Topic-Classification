experiment_name: news_topic_classification
seed: 42
device: null
paths:
  project_root: D:\Nowshin\Multi-Class News Topic Classification
  data_dir: data
  train_csv: Training_data_9.csv
  test_csv: Test_data.csv
  saved_models_dir: saved_models
  results_dir: results
  logs_dir: logs
  checkpoints_dir: checkpoints
data:
  text_column: News Headline
  label_column: News Topic
  num_classes: 4
  class_names:
  - Business
  - Science and Technology
  - Sports
  - World News
  val_split: 0.2
  test_split: 0.0
  remove_duplicates: true
  random_state: 42
preprocessing:
  mode: optimum
  remove_html: true
  lowercase: true
  remove_stopwords: true
  lemmatize: true
  remove_special_chars: true
  min_word_length: 2
  stopwords_language: english
tfidf:
  max_features: 20000
  ngram_range:
  - 1
  - 2
  sublinear_tf: true
  min_df: 2
  max_df: 0.95
word2vec:
  pretrained_model: word2vec-google-news-300
  vector_size: 300
  window: 5
  min_count: 2
  workers: 4
  sg: 1
  epochs: 10
sequence:
  max_len: 35
  embedding_dim: 300
  vocab_size: 50000
  pad_token: <PAD>
  unk_token: <UNK>
dnn:
  hidden_layers:
  - 256
  - 128
  - 64
  dropout: 0.4
  activation: relu
  batch_norm: false
rnn:
  cell_type: lstm
  hidden_size: 256
  num_layers: 2
  dropout: 0.3
  bidirectional: true
  pooling: mean_max
  use_layer_norm: true
attention:
  cell_type: lstm
  hidden_size: 256
  num_layers: 2
  dropout: 0.3
  bidirectional: true
  attention_dim: 128
transformer:
  d_model: 300
  nhead: 6
  num_encoder_layers: 4
  dim_feedforward: 512
  dropout: 0.3
  max_seq_len: 35
  pooling: cls
distilbert:
  model_name: distilbert-base-uncased
  max_length: 128
  freeze_base: true
  dropout: 0.3
  learning_rate: 2.0e-05
training:
  epochs: 15
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: adam
  early_stopping: true
  patience: 4
  min_delta: 0.0001
  monitor: val_f1
  scheduler: reduce_on_plateau
  scheduler_patience: 2
  scheduler_factor: 0.5
  scheduler_min_lr: 1.0e-06
  gradient_clip: 5.0
  mixed_precision: true
  use_class_weights: true
  save_best: true
  save_last: true
  log_interval: 100
  use_tensorboard: false
  use_wandb: false
  wandb_project: news-classification
inference:
  model_path: null
  preprocessor_path: null
  vectorizer_path: null
  label_encoder_path: null
  device: null
  batch_size: 128
