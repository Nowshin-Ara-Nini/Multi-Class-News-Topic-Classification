# All splits and features are derived from the training CSV only.
experiment_name: architecture_improvement
seed: 42
paths:
  data_dir: data
  train_csv: Training_data_9.csv
  test_csv: Test_data.csv
  saved_models_dir: saved_models/improved
  results_dir: results/improved
  logs_dir: logs/improved
  checkpoints_dir: checkpoints/improved
data:
  split_manifest: results/improved/split_manifest.json
  val_split: 0.2
  random_state: 42
preprocessing:
  mode: raw
sequence:
  max_len: 96
  trainable_embeddings: true
dnn:
  residual: true
  dropout: 0.2
rnn:
  compact_head: true
  dropout: 0.2
attention:
  combined_pooling: true
  dropout: 0.2
transformer:
  max_seq_len: 96
  normalize_input: true
  pooling: mean
  num_encoder_layers: 2
  dim_feedforward: 1200
  dropout: 0.1
distilbert:
  freeze_base: false
  pooling: cls_mean
  dropout: 0.1
  learning_rate: 0.00002
  head_lr_multiplier: 5.0
training:
  optimizer: adamw
  weight_decay: 0.01
  epochs: 5
  batch_size: 16
  accumulation_steps: 2
  scheduler: linear_warmup
  warmup_ratio: 0.06
  gradient_clip: 1.0
  patience: 2
  save_last: false
